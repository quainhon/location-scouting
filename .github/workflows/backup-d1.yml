name: Daily Location Scout D1 backup

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      expected_active_location_count:
        description: "Expected active location count for an on-demand restore drill (current acceptance: 7)"
        required: false
        default: '7'
        type: string

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install backup runtime
        run: npm ci --omit=dev
      - name: Export, restore-verify, and copy D1 to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          LOCATION_SCOUT_BACKUP_R2_BUCKET: ${{ secrets.LOCATION_SCOUT_BACKUP_R2_BUCKET }}
          EXPECTED_ACTIVE_LOCATION_COUNT: ${{ github.event.inputs.expected_active_location_count }}
        shell: bash
        run: |
          set -euo pipefail
          for required in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_R2_ACCESS_KEY_ID CLOUDFLARE_R2_SECRET_ACCESS_KEY LOCATION_SCOUT_BACKUP_R2_BUCKET; do
            if [[ -z "${!required}" ]]; then
              echo "::error::Configure the $required repository secret before enabling scheduled backups."
              exit 1
            fi
          done

          utc_stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          backup_file="$RUNNER_TEMP/location-scout-${utc_stamp}.sql"
          object_prefix="location-scout/backups/${utc_stamp}"

          export_log="$RUNNER_TEMP/wrangler-d1-export.log"
          if ! npx --yes wrangler@4 d1 export location-scout-db --remote --output="$backup_file" >"$export_log" 2>&1; then
            sed -E 's#https?://[^[:space:]]+#<redacted URL>#g' "$export_log" >&2
            exit 1
          fi
          echo "D1 export completed; Wrangler output is suppressed to keep temporary download URLs out of Actions logs."

          if [[ -n "${EXPECTED_ACTIVE_LOCATION_COUNT:-}" ]]; then
            if ! [[ "$EXPECTED_ACTIVE_LOCATION_COUNT" =~ ^[0-9]+$ ]]; then
              echo "::error::Expected active location count must be a non-negative integer."
              exit 1
            fi
            node scripts/verify-d1-export.mjs "$backup_file" "$EXPECTED_ACTIVE_LOCATION_COUNT"
          else
            node scripts/verify-d1-export.mjs "$backup_file"
          fi
          sha256sum "$backup_file" > "$backup_file.sha256"

          node scripts/r2-backup.mjs put "$LOCATION_SCOUT_BACKUP_R2_BUCKET" "${object_prefix}.sql" "$backup_file" application/sql
          node scripts/r2-backup.mjs put "$LOCATION_SCOUT_BACKUP_R2_BUCKET" "${object_prefix}.sql.sha256" "$backup_file.sha256" text/plain

          restored_file="$RUNNER_TEMP/location-scout-restored-${utc_stamp}.sql"
          node scripts/r2-backup.mjs get "$LOCATION_SCOUT_BACKUP_R2_BUCKET" "${object_prefix}.sql" "$restored_file"
          cmp --silent "$backup_file" "$restored_file"
          if [[ -n "${EXPECTED_ACTIVE_LOCATION_COUNT:-}" ]]; then
            node scripts/verify-d1-export.mjs "$restored_file" "$EXPECTED_ACTIVE_LOCATION_COUNT"
          else
            node scripts/verify-d1-export.mjs "$restored_file"
          fi
